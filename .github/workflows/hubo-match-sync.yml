name: HUBO Match Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  parser:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Parse Liga
        run: npm run liga

      - name: Parse Heren 1
        run: npm run heren1

      - name: Parse Dames 1
        run: npm run dames1

      - name: Parse J18
        run: npm run j18

      - name: Merge activities
        run: npm run merge

      - name: Validate activity count
        run: |
          node -e "
          const fs = require('fs');

          const previous = JSON.parse(
            fs.readFileSync('data/activities-count.json', 'utf8')
          );

          const data = JSON.parse(
            fs.readFileSync('data/activities.json', 'utf8')
          );

          const current = Array.isArray(data)
            ? data.length
            : data.count ?? data.activities?.length;

          if (typeof current !== 'number') {
            console.error('ERROR: Could not determine activity count.');
            process.exit(1);
          }

          console.log('Previous activity count:', previous.count);
          console.log('Current activity count:', current);

          const change = current - previous.count;
          const percentage = (change / previous.count) * 100;

          console.log(
            'Change:',
            change,
            '(' + percentage.toFixed(1) + '%)'
          );

          if (percentage < -20) {
            console.error(
              'ERROR: Activity count dropped by more than 20%.'
            );
            process.exit(1);
          }

          console.log('Activity count validation OK.');
          "

      - name: Update activity count
        run: |
          node -e "
          const fs = require('fs');

          const data = JSON.parse(
            fs.readFileSync('data/activities.json', 'utf8')
          );

          const current = Array.isArray(data)
            ? data.length
            : data.count ?? data.activities?.length;

          if (typeof current !== 'number') {
            console.error('ERROR: Could not determine activity count.');
            process.exit(1);
          }

          fs.writeFileSync(
            'data/activities-count.json',
            JSON.stringify({ count: current }, null, 2) + '\n'
          );

          console.log('Updated activity count to:', current);
          "

      - name: Commit updated activity count
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/activities-count.json

          if git diff --cached --quiet; then
            echo "No change in activity count."
          else
            git commit -m "Update activity count"
            git push
          fi

      - name: Prepare GitHub Pages
        run: |
          mkdir -p public
          cp data/activities.json public/

          cat > public/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>HUBO Match Sync</title>
          </head>
          <body>
            <h1>HUBO Match Sync</h1>
            <p>Available endpoint:</p>
            <ul>
              <li><a href="activities.json">activities.json</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
