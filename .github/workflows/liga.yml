- run: npm run clubee

- name: Upload HTML
  uses: actions/upload-artifact@v4
  with:
    name: liga-html
    path: data/liga.htmlname: Liga Parser

on:
  workflow_dispatch:

jobs:
  parser:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Install Playwright browser
        run: npx playwright install chromium

      - run: npm run clubee

      - uses: actions/upload-artifact@v4
        with:
          name: liga-html
          path: data/liga.html
