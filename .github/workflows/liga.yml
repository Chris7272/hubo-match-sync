name: HUBO Match Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  parser:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Parse Liga
        run: npm run liga

      - name: Parse Heren 1
        run: npm run heren1

      - name: Parse Dames 1
        run: npm run dames1

      - name: Parse J18
        run: npm run j18

      - name: Merge activities
        run: npm run merge

      - name: Prepare GitHub Pages
        run: |
          mkdir -p public
          cp data/activities.json public/

          cat > public/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>HUBO Match Sync</title>
          </head>
          <body>
            <h1>HUBO Match Sync</h1>
            <p>Available endpoint:</p>
            <ul>
              <li><a href="activities.json">activities.json</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
