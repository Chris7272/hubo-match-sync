name: Download Clubee

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Liga page
        run: |
          mkdir -p data
          curl -L "https://www.clubee.com/handballbelgium/liga-heren-1-982065v4/leagues/18707/seasons/220" -o data/liga.html

      - name: Show file size
        run: |
          ls -lh data
          wc -c data/liga.html

      - name: Upload HTML
        uses: actions/upload-artifact@v4
        with:
          name: clubee-html
          path: data/liga.html
