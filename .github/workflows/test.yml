name: Clubee Parser

on:
  workflow_dispatch:

jobs:
  parser:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run clubee

      - uses: actions/upload-artifact@v4
        with:
          name: liga-html
          path: data/liga.html
